<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast × AI — Flujos de Producción</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0f;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --text: #fff;
      --muted: #555;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --display: 'Bebas Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--sans);
      padding: 40px 20px 80px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    .wrapper { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 44px; }
    .header-badge {
      display: inline-block;
      font-family: var(--mono); font-size: 10px; letter-spacing: 4px;
      color: var(--muted); margin-bottom: 12px; text-transform: uppercase;
    }
    .header h1 {
      font-family: var(--display);
      font-size: clamp(36px, 6vw, 62px);
      color: var(--text); letter-spacing: 3px; line-height: 1;
    }
    .header h1 span { color: #f97316; }
    .header p { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 10px; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 36px;
    }
    .tab {
      font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
      padding: 8px 16px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--muted);
      transition: all 0.2s ease; white-space: nowrap;
    }
    .tab:hover { border-color: rgba(255,255,255,0.2); color: #aaa; }
    .tab.active {
      color: var(--text);
      border-color: var(--tab-color, #f97316);
      background: color-mix(in srgb, var(--tab-color, #f97316) 12%, transparent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--tab-color, #f97316) 30%, transparent);
    }

    /* ── Flow panel ── */
    .flow-panel { display: none; animation: fadeUp 0.35s ease forwards; }
    .flow-panel.active { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

    .flow-header { text-align: center; margin-bottom: 32px; }
    .flow-title {
      font-family: var(--display); font-size: clamp(22px, 4vw, 36px);
      color: var(--text); letter-spacing: 2px; margin-bottom: 6px;
    }
    .flow-title span { color: var(--flow-color, #f97316); }
    .flow-desc { font-family: var(--mono); font-size: 11px; color: var(--muted); }

    /* ── Nodes row ── */
    .flow-nodes {
      display: flex; align-items: center;
      justify-content: center; flex-wrap: wrap; gap: 0;
      margin-bottom: 12px;
    }

    .node {
      width: 136px; min-height: 160px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 12px;
      text-align: center; cursor: pointer;
      position: relative;
      transition: all 0.22s ease;
      opacity: 0; transform: translateY(16px);
      animation: fadeUp 0.35s ease forwards;
    }
    .node:hover { border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); }
    .node.active {
      border-color: var(--nc) !important;
      background: color-mix(in srgb, var(--nc) 12%, transparent) !important;
      box-shadow: 0 0 22px color-mix(in srgb, var(--nc) 35%, transparent);
    }
    .node.manual { border-style: dashed; }
    .node.manual::after {
      content: '◆ MANUAL';
      position: absolute; top: -10px; left: 50%;
      transform: translateX(-50%);
      background: var(--bg);
      font-family: var(--mono); font-size: 7px; letter-spacing: 1.5px;
      color: var(--nc); padding: 0 6px;
    }

    .node-label {
      font-family: var(--mono); font-size: 8px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--nc); margin-bottom: 8px;
    }
    .node-icon { font-size: 28px; margin-bottom: 8px; display: block; line-height: 1; }
    .node-name { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 5px; }
    .node-desc {
      font-family: var(--mono); font-size: 9px; color: #666;
      line-height: 1.6; white-space: pre-line;
    }
    .node-tool {
      display: inline-block; margin-top: 10px;
      border-radius: 999px; padding: 2px 9px;
      font-family: var(--mono); font-size: 8px;
      background: color-mix(in srgb, var(--nc) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--nc) 35%, transparent);
      color: var(--na);
    }
    .node-output {
      position: absolute; bottom: -14px; left: 50%;
      transform: translateX(-50%);
      background: var(--bg);
      border: 1px solid color-mix(in srgb, var(--nc) 50%, transparent);
      border-radius: 999px; padding: 2px 9px;
      font-family: var(--mono); font-size: 8px;
      color: var(--nc); white-space: nowrap; z-index: 2;
    }

    /* ── Arrow ── */
    .arrow {
      display: flex; flex-direction: column; align-items: center;
      width: 32px; opacity: 0.3; flex-shrink: 0;
    }
    .arrow-line { width: 18px; height: 1px; background: linear-gradient(90deg,#333,#777); }
    .arrow-head {
      width:0; height:0;
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 5px solid #777;
      margin-left: 18px; margin-top: -3px;
    }

    /* ── Detail panel ── */
    .detail {
      max-width: 580px; margin: 40px auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 22px 26px;
      display: none; animation: fadeUp 0.25s ease forwards;
    }
    .detail.visible { display: block; }
    .detail-title {
      font-family: var(--display); font-size: 20px;
      letter-spacing: 2px; color: var(--text); margin-bottom: 4px;
    }
    .detail-badge {
      display: inline-block; border-radius: 999px; padding: 3px 11px;
      font-family: var(--mono); font-size: 9px; margin-bottom: 14px;
    }
    .detail-body { font-size: 13px; color: #999; line-height: 1.75; }
    .detail-body strong { color: #ddd; }

    /* ── Legend ── */
    .legend {
      display: flex; gap: 20px; flex-wrap: wrap;
      justify-content: center; margin-top: 52px;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
    .legend-solid .legend-dot { }
    .legend-dashed { opacity: 0.7; }
    .legend-dashed .legend-dot { background: transparent !important; border: 1.5px dashed; border-radius: 50%; width: 9px; height: 9px; }
    .legend-label { font-family: var(--mono); font-size: 10px; color: var(--muted); }

    .hint { text-align:center; margin-top:18px; font-family:var(--mono); font-size:10px; color:#222; letter-spacing:1px; }

    @media (max-width: 600px) {
      .node { width: 110px; padding: 14px 8px; }
      .node-icon { font-size: 22px; }
      .node-name { font-size: 11px; }
    }
  </style>
</head>

    nodes: [
      { id:1, icon:"📚", label:"Entrada", name:"PDFs Asignatura", desc:"Apuntes · Libros\nDiapositivas", tool:null, color:"#94a3b8", accent:"#e2e8f0",
        detail:"Subes los <strong>PDFs del tema</strong> a un cuaderno de NotebookLM. Pueden ser apuntes, capítulos de libro o tus diapositivas." },

// State
let activeFlow = "f1";
let activeNode = null; // "flowId-nodeId"

function init() {
  renderTabs();
  renderPanels();
  activateFlow("f1");
}

function renderTabs() {
  const container = document.getElementById("tabs");
  flows.forEach(flow => {
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.id = "tab-" + flow.id;
    btn.textContent = flow.tab;
    btn.style.setProperty("--tab-color", flow.color);
    btn.addEventListener("click", () => activateFlow(flow.id));
    container.appendChild(btn);
  });
}

function renderPanels() {
  const container = document.getElementById("panels");
  flows.forEach(flow => {
    const panel = document.createElement("div");
    panel.className = "flow-panel";
    panel.id = "panel-" + flow.id;

    panel.innerHTML = `
      <div class="flow-header">
        <div class="flow-title" style="--flow-color:${flow.color}">${flow.title}</div>
        <div class="flow-desc">${flow.desc}</div>
      </div>
      <div class="flow-nodes" id="nodes-${flow.id}"></div>
      <div class="detail" id="detail-${flow.id}">
        <div class="detail-title" id="dtitle-${flow.id}"></div>
        <div class="detail-badge" id="dbadge-${flow.id}"></div>
        <div class="detail-body" id="dbody-${flow.id}"></div>
      </div>
    `;
    container.appendChild(panel);
    renderNodes(flow);
  });
}

function renderNodes(flow) {
  const container = document.getElementById("nodes-" + flow.id);
  container.innerHTML = "";

  flow.nodes.forEach((node, i) => {
    const key = flow.id + "-" + node.id;
    const isActive = activeNode === key;

    // Node
    const el = document.createElement("div");
    el.className = "node" + (node.manual ? " manual" : "") + (isActive ? " active" : "");
    el.style.setProperty("--nc", node.color);
    el.style.setProperty("--na", node.accent);
    el.style.animationDelay = (i * 0.08) + "s";

    el.innerHTML = `
      <div class="node-label">${node.label}</div>
      <span class="node-icon">${node.icon}</span>
      <div class="node-name">${node.name}</div>
      <div class="node-desc">${node.desc}</div>
      ${node.tool ? `<div class="node-tool">${node.tool}</div>` : ""}
      ${node.output ? `<div class="node-output">↓ ${node.output}</div>` : ""}
    `;

    el.addEventListener("click", () => {
      activeNode = activeNode === key ? null : key;
      renderNodes(flow);
      updateDetail(flow);
    });

    container.appendChild(el);

    // Arrow
    if (i < flow.nodes.length - 1) {
      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.innerHTML = `<div class="arrow-line"></div><div class="arrow-head"></div>`;
      container.appendChild(arrow);
    }
  });
}

function updateDetail(flow) {
  const panel = document.getElementById("detail-" + flow.id);
  const titleEl = document.getElementById("dtitle-" + flow.id);
  const badgeEl = document.getElementById("dbadge-" + flow.id);
  const bodyEl = document.getElementById("dbody-" + flow.id);

  const key = activeNode;
  if (!key || !key.startsWith(flow.id)) {
    panel.classList.remove("visible");
    return;
  }

  const nodeId = parseInt(key.split("-")[1]);
  const node = flow.nodes.find(n => n.id === nodeId);
  if (!node) return;

  titleEl.textContent = node.name;

  if (node.tool) {
    badgeEl.style.background = node.color + "22";
    badgeEl.style.border = `1px solid ${node.color}55`;
    badgeEl.style.color = node.accent;
    badgeEl.textContent = node.tool + (node.manual ? " · paso manual" : " · automatizado");
    badgeEl.style.display = "inline-block";
  } else {
    badgeEl.style.display = "none";
  }

  bodyEl.innerHTML = node.detail;
  panel.style.borderColor = node.color + "44";
  panel.classList.add("visible");
}

function activateFlow(id) {
  activeFlow = id;
  activeNode = null;

  // Tabs
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  const tab = document.getElementById("tab-" + id);
  if (tab) tab.classList.add("active");

  // Panels
  document.querySelectorAll(".flow-panel").forEach(p => p.classList.remove("active"));
  const panel = document.getElementById("panel-" + id);
  if (panel) panel.classList.add("active");

  // Hide detail
  const detail = document.getElementById("detail-" + id);
  if (detail) detail.classList.remove("visible");

  // Re-render nodes for animation
  const flow = flows.find(f => f.id === id);
  if (flow) renderNodes(flow);
}

init();
</script>
</body>
</html>
